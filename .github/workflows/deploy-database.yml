name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Push Supabase migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is missing"; exit 1; }

      - name: Deploy pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
